<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html"><img class="img-logo" src="../img/favicom.png" alt=""></a></div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto"></section>
        <h1 class="titulo-contacto text-secondary">Bienvenida a la pagina de contacto</h1>
        <p class="parrafo">
          Opciones de contacto
        </p>
        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="email"> Tu email: </label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje"> Tu Mensaje: </label>
            <textarea id="mensaje" name="message"></textarea>
          </div>
          <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Sitio realizado por Mati para Pre Entrega</p>
      <nav>
        <ul class="footer-list">
          <li><img class="img-redes" src="../img/whatsapp.png" alt="logo-whatsapp" /></li>
          <li><img class="img-redes" src="../img/social.png" alt="logo-instagram" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
